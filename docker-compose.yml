services:
  db:
    image: postgres:16-alpine
    env_file: .env
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-lotofacil}
      POSTGRES_USER: ${POSTGRES_USER:-lotofacil}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-lotofacil}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-lotofacil} -d ${POSTGRES_DB:-lotofacil}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pgdata:
