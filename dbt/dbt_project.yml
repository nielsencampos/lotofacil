name: "lotofacil"
version: "1.0.0"
config-version: 2

profile: "lotofacil"

model-paths: ["models"]
macro-paths: ["macros"]
seed-paths: ["seeds"]
test-paths: ["tests"]

target-path: "target"
clean-targets:
  - "target"
  - "dbt_packages"

# Required by the normalize_*_name() macros (dbt/macros/normalize_texts.sql)
# to strip accents reliably. Runs before every dbt invocation so `dbt run`
# is self-sufficient regardless of whether `lotofacil init-db` ran first.
on-run-start:
  - "create extension if not exists unaccent"

models:
  lotofacil:
    +persist_docs:
      relation: true
      columns: true
    bronze:
      +materialized: table
      +schema: bronze
      +tags: ["bronze"]
    silver:
      +materialized: table
      +schema: silver
      +tags: ["silver"]

seeds:
  lotofacil:
    +schema: bronze
    +persist_docs:
      relation: true
      columns: true
    +tags: ["bronze", "dictionary"]
    ball_names:
      +post-hook:
        - "alter table {{ this }} drop constraint if exists {{ this.identifier }}_pkey"
        - "alter table {{ this }} add primary key (number)"
    ball_orders:
      +post-hook:
        - "alter table {{ this }} drop constraint if exists {{ this.identifier }}_pkey"
        - "alter table {{ this }} add primary key (draw_order)"
