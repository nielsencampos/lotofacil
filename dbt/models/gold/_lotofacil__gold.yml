version: 2

models:
  - name: cube_contest
    description: >
      Gold cube: one row per contest with everything about it in one place
      (draw date and place, the balls in draw order and in numeric order,
      winners and prize per tier, winning municipalities and the money
      measures), so it can be read without joins. Built only from silver.
      Primary key: contest_nbr, enforced in PostgreSQL via a post-hook.
    columns:
      - name: contest_nbr
        description: Lotofacil contest number (primary key).
        tests:
          - unique
          - not_null
          - relationships:
              arguments:
                to: ref('dim_contest')
                field: contest_nbr

      - name: draw_dt
        description: Day this contest was drawn.
        tests:
          - not_null
      - name: draw_day_of_week_nm
        description: Day of the week of the draw, e.g. "SEGUNDA-FEIRA".
      - name: draw_year_nbr
        description: Year of the draw.
      - name: draw_month_nbr
        description: Month of the draw, 1-12.
      - name: draw_holiday_flg
        description: Whether the draw day is a Brazilian national holiday.
      - name: draw_holiday_nm
        description: >
          Holiday name when the draw day is a holiday, else ---NAO SE APLICA---.
      - name: next_draw_dt
        description: Day of the next scheduled contest.

      - name: location_nm
        description: Venue where the draw took place, e.g. "ESPACO DA SORTE".
      - name: city_nm
        description: City where the draw took place.
      - name: state_cd
        description: Two-letter state code of the draw city.

      - name: is_accumulated_flg
        description: Whether nobody won the top prize and it accumulated.
      - name: show_city_detail_flg
        description: Whether the source lists the winning municipalities.
      - name: independence_day_flg
        description: Whether this was a Lotofacil da Independencia draw.
      - name: remarks_desc
        description: Free-text remarks about the contest, upper case.
      - name: previous_contest_nbr
        description: Number of the previous contest.
      - name: final_contest_nbr
        description: Number of the contest that closes the current 0-5 cycle.
      - name: next_contest_nbr
        description: Number of the next contest.

      - name: balls_draw_order
        description: >
          The 15 drawn ball numbers in the order they came out (position 1
          first), as an integer array.
        tests:
          - not_null
      - name: balls_sorted
        description: The same 15 ball numbers in ascending order, as an integer array.
        tests:
          - not_null

      - name: tier_15_winner_qtty
        description: Winners with 15 hits (the top prize).
      - name: tier_15_prize_amt
        description: Prize paid to each winner with 15 hits, in BRL.
      - name: tier_14_winner_qtty
        description: Winners with 14 hits.
      - name: tier_14_prize_amt
        description: Prize paid to each winner with 14 hits, in BRL.
      - name: tier_13_winner_qtty
        description: Winners with 13 hits.
      - name: tier_13_prize_amt
        description: Prize paid to each winner with 13 hits, in BRL.
      - name: tier_12_winner_qtty
        description: Winners with 12 hits.
      - name: tier_12_prize_amt
        description: Prize paid to each winner with 12 hits, in BRL.
      - name: tier_11_winner_qtty
        description: Winners with 11 hits.
      - name: tier_11_prize_amt
        description: Prize paid to each winner with 11 hits, in BRL.
      - name: winner_total_qtty
        description: Winners across all prize tiers (11 to 15 hits).
        tests:
          - not_null

      - name: tier_15_winning_municipality_qtty
        description: >
          Number of entries in the winning municipalities list (0 when the
          source lists none). The source does not label the tier, but the list
          only exists for contests with a 15-hit winner. Not reconciled with
          tier_15_winner_qtty.
        tests:
          - not_null
      - name: tier_15_winning_locations
        description: >
          JSON array with one object per winning municipality entry of the
          15-hit tier, in source order, each with city_nm, state_cd and
          winner_qtty. Empty array when there are none. Tiers 11 to 14 have no
          location data in the source.
        tests:
          - not_null

      - name: collected_amt
        description: Total amount collected from bets, in BRL.
      - name: accumulated_amt
        description: Amount accumulated for the 0-5 cycle, in BRL.
      - name: special_accumulated_amt
        description: Amount accumulated for the special draw, in BRL.
      - name: next_accumulated_amt
        description: Amount that accumulates into the next contest, in BRL.
      - name: next_estimated_prize_amt
        description: Estimated top prize of the next contest, in BRL.
      - name: guarantee_fund_balance_amt
        description: Balance of the guarantee fund, in BRL.
      - name: total_prize_tier_one_amt
        description: Total prize amount of the top tier, in BRL.

  - name: similar_contests
    description: >
      Gold bridge: one row per pair of contests that drew at least 13 of the
      same 15 balls, contest_a_nbr always the earlier contest. Two random
      contests already share ~9 balls by chance, so the cut starts at 13, not
      at the lowest prize tier (11). 15 shared balls means an identical
      repeat. Built directly from silver, independent of cube_contest.
      Primary key: (contest_a_nbr, contest_b_nbr), enforced in PostgreSQL via
      a post-hook.
    tests:
      - unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - contest_a_nbr
              - contest_b_nbr
    columns:
      - name: contest_a_nbr
        description: Number of the earlier contest in the pair.
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_contest')
                field: contest_nbr
      - name: contest_a_draw_dt
        description: Day the earlier contest was drawn.
        tests:
          - not_null
      - name: contest_a_location_nm
        description: Venue where the earlier contest was drawn.
        tests:
          - not_null
      - name: contest_a_city_nm
        description: City where the earlier contest was drawn.
        tests:
          - not_null
      - name: contest_a_state_cd
        description: Two-letter state code of the earlier contest's draw city.
        tests:
          - not_null
      - name: contest_a_tier_15_winner_qtty
        description: Winners with all 15 hits (the top prize) in the earlier contest.
        tests:
          - not_null
      - name: contest_a_tier_15_winning_municipality_qtty
        description: >
          Number of entries in the earlier contest's winning municipalities
          list (0 when the source lists none). Not reconciled with
          contest_a_tier_15_winner_qtty, same as cube_contest.
        tests:
          - not_null
      - name: contest_a_tier_15_winning_locations
        description: >
          JSON array with one object per winning municipality entry of the
          earlier contest's tier-15 winners, in source order, each with
          city_nm, state_cd and winner_qtty. Empty array when there are none.
        tests:
          - not_null
      - name: contest_b_nbr
        description: Number of the later contest in the pair.
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_contest')
                field: contest_nbr
      - name: contest_b_draw_dt
        description: Day the later contest was drawn.
        tests:
          - not_null
      - name: contest_b_location_nm
        description: Venue where the later contest was drawn.
        tests:
          - not_null
      - name: contest_b_city_nm
        description: City where the later contest was drawn.
        tests:
          - not_null
      - name: contest_b_state_cd
        description: Two-letter state code of the later contest's draw city.
        tests:
          - not_null
      - name: contest_b_tier_15_winner_qtty
        description: Winners with all 15 hits (the top prize) in the later contest.
        tests:
          - not_null
      - name: contest_b_tier_15_winning_municipality_qtty
        description: >
          Number of entries in the later contest's winning municipalities
          list (0 when the source lists none). Not reconciled with
          contest_b_tier_15_winner_qtty, same as cube_contest.
        tests:
          - not_null
      - name: contest_b_tier_15_winning_locations
        description: >
          JSON array with one object per winning municipality entry of the
          later contest's tier-15 winners, in source order, each with
          city_nm, state_cd and winner_qtty. Empty array when there are none.
        tests:
          - not_null
      - name: shared_ball_qtty
        description: How many of the 15 balls the two contests have in common, 13 to 15.
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: [13, 14, 15]
      - name: shared_balls
        description: The ball numbers the two contests have in common, ascending.
        tests:
          - not_null

  - name: ball_frequency
    description: >
      Gold cube: one row per ball (1-25), its share of the balls drawn (not
      of the contests -- see below) over a set of windows anchored on the
      most recent contest (the last 1/2/3/5/10/15/25 contests by draw order,
      cumulative -- last_2_contests_pct is the last 2 contests taken
      together, not the second-to-last contest alone -- the last 1/2/3/5/10
      calendar years, and the whole history). Each window's 25 percentages
      sum to 100, checked by
      tests/ball_frequency_pct_columns_sum_to_100.sql. Built directly from
      silver, independent of the other gold tables. Primary key: ball_nbr,
      enforced in PostgreSQL via a post-hook.
    columns:
      - name: ball_nbr
        description: Ball number, 1 to 25 (primary key).
        tests:
          - unique
          - not_null
          - relationships:
              arguments:
                to: ref('dim_ball')
                field: ball_nbr
      - name: last_contest_pct
        description: >
          Share of the 15 balls drawn in the most recent contest that were
          this ball: 0 for the 10 balls that didn't come out, 100/15 = 6.6667
          for the 15 that did.
        tests:
          - not_null
      - name: last_2_contests_pct
        description: >
          Share of the balls drawn in the last 2 contests (by draw order,
          taken together) that were this ball.
        tests:
          - not_null
      - name: last_3_contests_pct
        description: >
          Share of the balls drawn in the last 3 contests (by draw order,
          taken together) that were this ball.
        tests:
          - not_null
      - name: last_5_contests_pct
        description: Share of the balls drawn in the last 5 contests (by draw order) that were this ball.
        tests:
          - not_null
      - name: last_10_contests_pct
        description: Share of the balls drawn in the last 10 contests (by draw order) that were this ball.
        tests:
          - not_null
      - name: last_15_contests_pct
        description: Share of the balls drawn in the last 15 contests (by draw order) that were this ball.
        tests:
          - not_null
      - name: last_25_contests_pct
        description: Share of the balls drawn in the last 25 contests (by draw order) that were this ball.
        tests:
          - not_null
      - name: last_1_year_pct
        description: >
          Share of the balls drawn in the contests from the 1 calendar year
          up to the most recent draw that were this ball.
        tests:
          - not_null
      - name: last_2_years_pct
        description: Share of the balls drawn in the last 2 calendar years that were this ball.
        tests:
          - not_null
      - name: last_3_years_pct
        description: Share of the balls drawn in the last 3 calendar years that were this ball.
        tests:
          - not_null
      - name: last_5_years_pct
        description: Share of the balls drawn in the last 5 calendar years that were this ball.
        tests:
          - not_null
      - name: last_10_years_pct
        description: Share of the balls drawn in the last 10 calendar years that were this ball.
        tests:
          - not_null
      - name: total_pct
        description: Share of every ball ever drawn that was this ball.
        tests:
          - not_null
